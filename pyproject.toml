[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kpi-definition-change-trial"
version = "0.3.0"
description = "Deterministic KPI-definition migration and restatement evidence trial"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.uv]
package = false
