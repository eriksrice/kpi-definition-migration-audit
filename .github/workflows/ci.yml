name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Synchronize locked environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Test and lint
        run: ./scripts/test_golden
      - name: Run deterministic demonstration
        run: ./scripts/run_demo
      - name: Verify checked-in canonical evidence
        run: |
          ./scripts/run_golden
          git diff --exit-code -- artifacts/golden schemas
